name: tests

# Hardware-independent checks on every PR (#37): pytest plus the #41 smoke command.
# Manual, never in CI: headset pairing, live calibration, audible speech, the g.Pype GUI by
# eye, and the Wi-Fi-off launch. Each run lists them in its job summary.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded PR runs only. Every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every PR in a few seconds, with nothing installed. It also decides whether the
  # change touches code. Docs, the devlog and images skip the slow test steps below.
  quick:
    name: quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No conflict markers, no duplicated devlog entries
        run: python3 tools/quick_check.py
      - name: Does this change need the test suite?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            code=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | python3 tools/quick_check.py --needs-tests)
          else
            code=true                 # pushes to main and manual runs always test everything
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then msg="Code changed: running the full test jobs."
          else msg="Docs-only change: the test jobs skip install, pytest and smoke."; fi
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: quick
    # Always report, so the required checks resolve: these jobs pass fast on a docs-only change
    # and fail if the quick checks failed.
    if: ${{ !cancelled() }}
    name: ci (${{ matrix.os }}, py${{ matrix.python }})   # pytest + smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # g.Pype ships wheels for Windows x64, Linux x86_64, and macOS Apple silicon only.
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 3.12 everywhere: the verified version the judging laptop runs (requirements-lock.txt).
        # One extra Ubuntu job on 3.13 is a forward-compat canary. It caught a 3.13-only test
        # bug in #41 the day CI landed. Other versions (3.10, 3.11, 3.14) are untested. That's
        # why ubuntu-latest appears twice: py3.12 and py3.13. This comment is the one place
        # that explains the matrix; docs link here.
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen   # PySide6 and g.Pype scopes without a display
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash                # same syntax on Windows; GitHub runs bash with -eo pipefail
    steps:
      - name: Quick checks must pass
        if: needs.quick.result != 'success'
        run: |
          echo "The quick checks job failed. See its log."
          exit 1

      - name: Docs-only change, tests skipped
        if: needs.quick.outputs.code != 'true'
        run: |
          echo "### Docs-only change, so install, pytest and smoke were skipped" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: needs.quick.outputs.code == 'true'

      - uses: actions/setup-python@v5
        if: needs.quick.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Linux system libraries (Qt offscreen, Qt Multimedia, speech, Bluetooth runtime)
        if: needs.quick.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libpulse0 libpulse-mainloop-glib0 espeak-ng libbluetooth3

      - name: Install (versions constrained to requirements-lock.txt)
        id: install
        if: needs.quick.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          # -c applies the verified pins where a package is needed. Windows-only pins
          # (pywin32, comtypes) are ignored on other platforms.
          pip install --resume-retries 30 --timeout 120 -c requirements-lock.txt -e ".[dev,mcp]"

      - name: Show versions
        if: needs.quick.outputs.code == 'true'
        run: |
          python - <<'EOF'
          import sys
          from importlib.metadata import PackageNotFoundError, version
          print(sys.version)
          for pkg in ("gpype", "PySide6", "scikit-learn", "numpy", "h5py", "pyttsx3"):
              try:
                  print(f"{pkg} {version(pkg)}")
              except PackageNotFoundError:
                  print(f"{pkg} not installed")
          EOF

      - name: pytest
        id: pytest
        if: needs.quick.outputs.code == 'true'
        run: |
          set +e                        # write the summary even when tests fail
          # Slow real-time tests run on every OS for pushes to main, and on Windows (the
          # judging laptop) plus Ubuntu py3.12 for PRs. The other PR jobs skip them.
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ runner.os }}" = "Windows" ]              || { [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.python }}" = "3.12" ]; }; then
            sel=(); scope="full"
          else
            sel=(-m "not slow"); scope="fast (slow tests run on Windows + Ubuntu py3.12)"
          fi
          echo "pytest scope: $scope"
          pytest -q -rs "${sel[@]}" 2>&1 | tee pytest.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### pytest (${{ matrix.os }}, py${{ matrix.python }}, $scope): exit $rc"
            echo '```'
            tail -n 1 pytest.txt
            grep '^SKIPPED' pytest.txt || echo "no skips"
            grep -E '^(FAILED|ERROR)' pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Smoke (#41)
        if: always() && needs.quick.outputs.code == 'true' && steps.install.outcome == 'success'
        run: |
          set +e
          # --help must work: a broken app import fails here instead of looking like a skip.
          help=$(python -m signal2speech.app --help 2>&1)
          hrc=$?
          if [ $hrc -ne 0 ]; then
            echo "$help"
            { echo "### smoke: app failed to start (exit $hrc)"; echo '```'; echo "$help" | tail -n 20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $hrc
          fi
          if [[ "$help" == *"--smoke"* ]]; then
            python -m signal2speech.app --smoke 2>&1 | tee smoke.txt
            rc=${PIPESTATUS[0]}
          else
            echo "::notice title=Smoke skipped::python -m signal2speech.app --smoke isn't on this branch yet (#41)"
            echo "SMOKE SKIPPED: --smoke not on this branch yet (#41)" > smoke.txt
            rc=0
          fi
          { echo "### smoke: exit $rc"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Manual checks (not run in CI)
        if: always() && needs.quick.outputs.code == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Manual checks (not run in CI)
          - Headset: pair the Unicorn in OS Bluetooth, check all 8 channels (#23)
          - Live calibration: P300 chooser (#46) and alpha threshold (#47) on the demo wearer (#23)
          - g.Pype GUI: evidence scopes open and move (`python -m signal2speech.evidence`, #48)
          - Audio: the confirmed line is audible on the judging laptop speakers
          - Offline: Wi-Fi off, then `python -m signal2speech.app` runs the full reveal
          EOF
