name: tests

# Hardware-independent checks on every PR (#37): pytest plus the #41 smoke command.
# Manual, never in CI: headset pairing, live calibration, audible speech, the g.Pype GUI by
# eye, and the Wi-Fi-off launch. Each run lists them in its job summary.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded PR runs only. Every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # g.Pype ships wheels for Windows x64, Linux x86_64, and macOS Apple silicon only.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen   # PySide6 and g.Pype scopes without a display
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash                # same syntax on Windows; GitHub runs bash with -eo pipefail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Linux system libraries (Qt offscreen, Qt Multimedia, speech, Bluetooth runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libpulse0 libpulse-mainloop-glib0 espeak-ng libbluetooth3

      - name: Install (versions constrained to requirements-lock.txt)
        id: install
        run: |
          python -m pip install --upgrade pip
          # -c applies the verified pins where a package is needed. Windows-only pins
          # (pywin32, comtypes) are ignored on other platforms.
          pip install --resume-retries 30 --timeout 120 -c requirements-lock.txt -e ".[dev]"

      - name: Show versions
        run: |
          python - <<'EOF'
          import sys
          from importlib.metadata import PackageNotFoundError, version
          print(sys.version)
          for pkg in ("gpype", "PySide6", "scikit-learn", "numpy", "h5py", "pyttsx3"):
              try:
                  print(f"{pkg} {version(pkg)}")
              except PackageNotFoundError:
                  print(f"{pkg} not installed")
          EOF

      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest.txt
          {
            echo "### pytest (${{ matrix.os }}, py${{ matrix.python }})"
            echo '```'
            tail -n 1 pytest.txt
            grep '^SKIPPED' pytest.txt || echo "no skips"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke (#41)
        if: always() && steps.install.outcome != 'failure'
        run: |
          set -o pipefail
          if python -m signal2speech.app --help | grep -q -- '--smoke'; then
            python -m signal2speech.app --smoke 2>&1 | tee smoke.txt
          else
            echo "::notice title=Smoke skipped::python -m signal2speech.app --smoke isn't on this branch yet (#41)"
            echo "SMOKE SKIPPED: --smoke not on this branch yet (#41)" > smoke.txt
          fi
          { echo "### smoke"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Manual checks (not run in CI)
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Manual checks (not run in CI)
          - Headset: pair the Unicorn in OS Bluetooth, check all 8 channels (#23)
          - Live calibration: P300 chooser (#46) and alpha threshold (#47) on the demo wearer (#23)
          - g.Pype GUI: evidence scopes open and move (`python -m signal2speech.evidence`, #48)
          - Audio: the confirmed line is audible on the judging laptop speakers
          - Offline: Wi-Fi off, then `python -m signal2speech.app` runs the full reveal
          EOF
