name: tests

# Hardware-independent checks on every PR (#37). The headset, Bluetooth pairing, audio
# output, and Wi-Fi-off launch stay manual: see docs/dev-setup-docs/README.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # g.Pype ships wheels for Windows x64, Linux x86_64, and macOS Apple silicon only.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen   # PySide6 and g.Pype scopes without a display
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux system libraries (Qt offscreen, speech, Bluetooth headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 espeak-ng libespeak1 libbluetooth3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --resume-retries 30 --timeout 120 -e ".[dev]"

      - name: Show versions
        run: python -c "import sys, gpype, PySide6, sklearn; print(sys.version); print('gpype', gpype.__version__, 'PySide6', PySide6.__version__, 'sklearn', sklearn.__version__)"

      - name: pytest
        run: pytest -q -rs
